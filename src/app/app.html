<div class="min-h-dvh bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <header class="border-b border-slate-200 dark:border-slate-800">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3">
      <a routerLink="/" class="text-lg font-semibold">MyMind</a>

      <!-- Rendered only after the session is known, so SSR never flashes the wrong state. -->
      @if (auth.loaded()) {
        <div class="flex items-center gap-4 text-sm">
          @if (auth.user(); as user) {
            <a routerLink="/me" class="hover:underline">&#64;{{ user.userName }}</a>
            <button type="button" class="hover:underline" (click)="logout()" i18n>Chiqish</button>
          } @else {
            <a routerLink="/login" class="hover:underline" i18n>Kirish</a>
            <a routerLink="/register" class="form-button w-auto px-3 py-1.5" i18n
              >Ro'yxatdan o'tish</a
            >
          }
        </div>
      }
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
